
# Kafka
bootstrap.servers=localhost:9092

# Connect Cluster. Workers with the same group.id share teh same work
group.id=cdc-students-connect

# key and value are turned into bytes in kafka
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false

# Internal topics where Connect stores its own state
config.storage.topic=connect-configs
offset.storage.topic=connect-offsets
status.storage.topic=connect-status

# one broker, so each topic can only have one copy
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1

# Spring REST API use to manage connectors
listeners=http://localhost:8083

#plugin folder
plugin.path= echo $HOME/Documents/Development/projects/kafka-connect-plugins

# How often Connect saves its reading position
offset.flush.interval.ms=10000
