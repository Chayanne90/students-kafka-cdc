spring:
  mvc:
    problemdetails:
      enabled: true

  output:
    ansi:
      enabled: always
  config:
    import: optional:file:.env[.properties]
  application:
    name: students-service

  datasource:
    url: jdbc:postgresql://${HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${HOST}:${K_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
